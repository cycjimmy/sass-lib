name: Bug report
description: Create a report to help us improve
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so the issue can be triaged quickly.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version of `@cycjimmy/sass-lib` you are using.
      placeholder: 5.0.0
    validations:
      required: true

  - type: input
    id: dart-sass-version
    attributes:
      label: Dart Sass version
      description: The output of `sass --version`.
      placeholder: 1.106.0
    validations:
      required: true

  - type: input
    id: build-tool
    attributes:
      label: Build tool
      description: How the SCSS is compiled, for example webpack + sass-loader, Vite, or the Dart Sass CLI.
      placeholder: Vite 7 + sass 1.106.0

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js/npm versions, OS, and the browser if the problem is UI related.
      placeholder: |
        Node.js: 24
        npm: 11
        OS: macOS 15
        Browser: Chrome 130 (only if UI related)
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior, or a minimal repository that shows the problem.
      placeholder: |
        1. Import '@cycjimmy/sass-lib' in '...'
        2. Compile with '...'
        3. See error
      render: text
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Relevant SCSS or configuration
      description: The SCSS snippet and the build configuration that trigger the problem.
      render: scss

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: The compiler or bundler output around the failure, if available.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.

name: Dependabot Auto Merge
on: pull_request
permissions:
  contents: write
  pull-requests: write
  # `gh pr checks` reads check runs and commit statuses; an unspecified scope is `none`
  # once `permissions` is declared.
  checks: read
  statuses: read
jobs:
  auto-merge:
    # Fork pull requests never receive a write token, so gate on the same-repo branch too.
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A stuck check must fail the job instead of holding a runner for six hours
    timeout-minutes: 30
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3

      # `main` carries no required status check, because semantic-release has to
      # push its version commit there and GitHub rejects that push while one is
      # configured. The gate therefore lives here: wait for the aggregated CI
      # check and only then ask for the merge.
      #
      # `gh pr checks --watch` cannot be used here: the check list contains this
      # very job, so watching it would wait for itself until the job times out.
      # Only the explicitly expected check names are polled instead.
      - name: Wait for the pull request checks
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_CHECKS: Test CI Summary
        run: |
          for _ in $(seq 1 120); do
            checks=$(gh pr checks "$PR_URL" --json name,bucket 2>/dev/null || echo '[]')
            state=$(printf '%s' "$checks" | jq -r --arg required "$REQUIRED_CHECKS" '
              ($required | split("\n") | map(select(length > 0))) as $want
              | [ .[] | select(.name as $name | any($want[]; $name == .)) ] as $got
              | if any($got[]; .bucket == "fail" or .bucket == "cancel") then "failed"
                elif ($got | length) < ($want | length) then "waiting"
                elif all($got[]; .bucket == "pass" or .bucket == "skipping") then "passed"
                else "waiting" end
            ')

            case "$state" in
              passed) exit 0 ;;
              failed)
                printf '%s' "$checks" | jq -r '.[] | select(.bucket == "fail" or .bucket == "cancel") | "  \(.name): \(.bucket)"'
                echo "::error::A check on the pull request did not pass."
                exit 1
                ;;
            esac

            # A new push restarts this workflow with a fresh gate, so stop here.
            current=$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)
            if [ "$current" != "$PR_HEAD_SHA" ]; then
              echo "The pull request head moved to ${current}; leaving it to the next run."
              exit 0
            fi

            echo "Still waiting for: $REQUIRED_CHECKS"
            sleep 10
          done

          echo "::error::Timed out waiting for: $REQUIRED_CHECKS"
          exit 1

      - name: Merge the pull request
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `--auto` merges straight away here because the branch has no required
          # status check of its own, so re-check the head commit right before it and
          # make GitHub reject the merge if the head moved in between.
          current=$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)
          if [ "$current" != "$PR_HEAD_SHA" ]; then
            echo "The pull request head moved to ${current}; skipping the merge."
            exit 0
          fi
          gh pr merge --auto --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
